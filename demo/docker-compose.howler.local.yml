services:
  clue-api:
    image: clue-api:dev
    environment:
      CLUE_DEV_BYPASS_AUTH: "true"
      CLUE_DEV_USER: local-dev
      CLUE_DEV_NAME: Local Dev
      CLUE_DEV_CLASSIFICATION: TLP:CLEAR
      API__EXTERNAL_SOURCES: |
        [
          {"name": "port-lookup", "url": "http://port-lookup:5100", "classification": "TLP:CLEAR"},
          {"name": "rdap-whois", "url": "http://rdap-whois:5108", "classification": "TLP:CLEAR"},
          {"name": "maxmind", "url": "http://maxmind:5110", "classification": "TLP:CLEAR"},
          {"name": "urlscan", "url": "http://urlscan:5112", "classification": "TLP:CLEAR"},
          {"name": "alienvault-otx", "url": "http://alienvault-otx:5111", "classification": "TLP:CLEAR"},
          {"name": "greynoise", "url": "http://greynoise:5113", "classification": "TLP:CLEAR"},
          {"name": "shodan", "url": "http://shodan:5114", "classification": "TLP:CLEAR"},
          {"name": "crt-sh", "url": "http://crtsh:5101", "classification": "TLP:CLEAR", "include_default": false},
          {"name": "howler", "url": "http://howler-plugin:5102", "classification": "TLP:CLEAR"},
          {"name": "malware-bazaar", "url": "http://malware-bazaar:5103", "classification": "TLP:CLEAR"},
          {"name": "virustotal", "url": "http://virustotal:5104", "classification": "TLP:CLEAR"},
          {"name": "abuseipdb", "url": "http://abuseipdb:5106", "classification": "TLP:CLEAR"}
        ]

  rdap-whois:
    build:
      context: ../plugins/rdap_whois
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-rdap-whois:dev
    restart: unless-stopped
    ports:
      - "5108:5108"
    environment:
      APP_NAME: rdap-whois
      CLASSIFICATION: TLP:CLEAR
      PORT: 5108
      WORKERS: 1
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  maxmind:
    build:
      context: ../plugins/maxmind
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-maxmind:dev
    restart: unless-stopped
    ports:
      - "5110:5110"
    environment:
      APP_NAME: maxmind
      CLASSIFICATION: TLP:CLEAR
      PORT: 5110
      WORKERS: 1
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
      MAXMIND_ASN_DB: /data/maxmind/GeoLite2-ASN.mmdb,/usr/share/GeoIP/GeoLite2-ASN.mmdb,/var/lib/GeoIP/GeoLite2-ASN.mmdb
      MAXMIND_COUNTRY_DB: /data/maxmind/GeoLite2-Country.mmdb,/usr/share/GeoIP/GeoLite2-Country.mmdb,/var/lib/GeoIP/GeoLite2-Country.mmdb
      MAXMIND_CITY_DB: /data/maxmind/GeoLite2-City.mmdb,/usr/share/GeoIP/GeoLite2-City.mmdb,/var/lib/GeoIP/GeoLite2-City.mmdb
    volumes:
      - ${MAXMIND_DB_DIR:-./maxmind}:/data/maxmind:ro
    networks:
      - clue-network

  urlscan:
    build:
      context: ../plugins/urlscan
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-urlscan:dev
    restart: unless-stopped
    ports:
      - "5112:5112"
    environment:
      APP_NAME: urlscan
      CLASSIFICATION: TLP:CLEAR
      PORT: 5112
      WORKERS: 1
      URLSCAN_API_KEY: ${URLSCAN_API_KEY:-}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  alienvault-otx:
    build:
      context: ../plugins/alienvault_otx
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-alienvault-otx:dev
    restart: unless-stopped
    ports:
      - "5111:5111"
    environment:
      APP_NAME: alienvault-otx
      CLASSIFICATION: TLP:CLEAR
      PORT: 5111
      WORKERS: 1
      OTX_API_KEY: ${OTX_API_KEY:-${ALIENVAULT_API_KEY:-}}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  greynoise:
    build:
      context: ../plugins/greynoise
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-greynoise:dev
    restart: unless-stopped
    ports:
      - "5113:5113"
    environment:
      APP_NAME: greynoise
      CLASSIFICATION: TLP:CLEAR
      PORT: 5113
      WORKERS: 1
      GREYNOISE_API_KEY: ${GREYNOISE_API_KEY:-${GN_API_KEY:-}}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  shodan:
    build:
      context: ../plugins/shodan
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-shodan:dev
    restart: unless-stopped
    ports:
      - "5114:5114"
    environment:
      APP_NAME: shodan
      CLASSIFICATION: TLP:CLEAR
      PORT: 5114
      WORKERS: 1
      SHODAN_API_KEY: ${SHODAN_API_KEY:-${SHODAN_KEY:-}}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  crtsh:
    build:
      context: ../plugins/crtsh
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-crtsh:dev
    environment:
      APP_NAME: crtsh
      CLASSIFICATION: TLP:CLEAR
      PORT: 5101
      WORKERS: 1
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379

  howler-plugin:
    image: cccs/clue-plugin-howler:latest
    restart: unless-stopped
    ports:
      - "5102:5102"
    environment:
      APP_NAME: howler
      CLASSIFICATION: TLP:CLEAR
      PORT: 5102
      WORKERS: 1
      HOWLER_URL: ${HOWLER_URL:-http://host.docker.internal:5000}
      HOWLER_AUDIENCE: ${HOWLER_AUDIENCE:-7fd79813-310c-456f-b90e-2fdbdf55471b}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - clue-network

  malware-bazaar:
    image: cccs/clue-plugin-malware-bazaar:latest
    restart: unless-stopped
    ports:
      - "5103:5103"
    environment:
      APP_NAME: malware-bazaar
      CLASSIFICATION: TLP:CLEAR
      PORT: 5103
      WORKERS: 1
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  virustotal:
    image: cccs/clue-plugin-virustotal:latest
    restart: unless-stopped
    ports:
      - "5104:5104"
    environment:
      APP_NAME: virustotal
      CLASSIFICATION: TLP:CLEAR
      PORT: 5104
      WORKERS: 1
      VT_API_KEY: ${VT_API_KEY:-${VT_KEY:-}}
      VT_KEY: ${VT_KEY:-}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network

  abuseipdb:
    build:
      context: ../plugins/abuseipdb
      dockerfile: ../base/plugin.Dockerfile
      args:
        base_plugin_version: 1.4
    image: clue-plugin-abuseipdb:dev
    restart: unless-stopped
    ports:
      - "5106:5106"
    environment:
      APP_NAME: abuseipdb
      CLASSIFICATION: TLP:CLEAR
      PORT: 5106
      WORKERS: 1
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-${ABUSEIPDB_KEY:-}}
      CORE__REDIS__HOST: redis
      CORE__REDIS__PORT: 6379
    networks:
      - clue-network
